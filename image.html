<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The One Ring – Image Tracking</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body class="ar-page">
    <header class="logo-container">
      <div class="logo-stack">
        <div class="logo-title-row">
          <h1 class="logo-text">
            <a href="index.html" class="logo-link">The One Ring</a>
          </h1>
        </div>
        <p class="subtitle">Corrupt The Ring</p>
      </div>
    </header>

    <div class="ar-wrapper">
      <header class="ar-floating-header">
        <a href="index.html" class="nav-button ar-floating-button">← Back</a>
        <button
          id="download-markers-button"
          class="nav-button ar-floating-button"
          type="button"
        >
          Download markers
        </button>
      </header>
      <a-scene
        mindar-image="imageTargetSrc: assets/targets.mind; maxTrack: 1;"
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false"
      >
        <a-assets>
          <a-asset-item
            id="ringEmpty"
            src="assets/models/ring_empty.glb"
          ></a-asset-item>

          <a-asset-item
            id="ringModel"
            src="assets/models/ring_base.glb"
          ></a-asset-item>

          <a-asset-item
            id="ringGreenModel"
            src="assets/models/ring_green.glb"
          ></a-asset-item>

          <a-asset-item
            id="ringRedModel"
            src="assets/models/ring_red.glb"
          ></a-asset-item>

          <a-asset-item
            id="ringBlueModel"
            src="assets/models/ring_blue.glb"
          ></a-asset-item>
        </a-assets>

        <a-light type="ambient" intensity="100"></a-light>
        <a-light type="directional" position="1 2 1" intensity="50"></a-light>
        <a-light type="directional" position="-1 1 1" intensity="50"></a-light>
        <a-light type="directional" position="-4 -2 1" intensity="50"></a-light>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" data-target-index="0">
          <a-entity
            class="ring-base"
            gltf-model="#ringEmpty"
            position="0 -0.5 -3"
            rotation="0 0 0"
            scale="0.25 0.25 0.25"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
          ></a-entity>
          <a-entity
            class="ring-forged"
            gltf-model="#ringModel"
            visible="false"
            position="0 -0.5 -3"
            rotation="0 0 0"
            scale="0.25 0.25 0.25"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
          ></a-entity>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 1" data-target-index="1">
          <a-entity
            class="ring-base"
            gltf-model="#ringEmpty"
            position="0 -0.5 -3"
            rotation="0 0 0"
            scale="0.25 0.25 0.25"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
          ></a-entity>
          <a-entity
            class="ring-forged"
            gltf-model="#ringGreenModel"
            visible="false"
            position="0 0 -3"
            rotation="0 0 0"
            scale="0.25 0.25 0.25"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
          ></a-entity>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 2" data-target-index="2">
          <a-entity
            class="ring-base"
            gltf-model="#ringEmpty"
            position="0 -0.5 -3"
            rotation="0 0 0"
            scale="0.25 0.25 0.25"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
          ></a-entity>
          <a-entity
            class="ring-forged"
            gltf-model="#ringBlueModel"
            visible="false"
            position="0 0 -3"
            rotation="0 0 0"
            scale="0.25 0.25 0.25"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
          ></a-entity>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 3" data-target-index="3">
          <a-entity
            class="ring-base"
            gltf-model="#ringEmpty"
            position="0 -0.5 -3"
            rotation="0 0 0"
            scale="0.25 0.25 0.25"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
          ></a-entity>
          <a-entity
            class="ring-forged"
            gltf-model="#ringRedModel"
            visible="false"
            position="0 0 -3"
            rotation="0 0 0"
            scale="0.25 0.25 0.25"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
          ></a-entity>
        </a-entity>
      </a-scene>
    </div>

    <nav class="nav-container nav-container-single">
      <button id="forge-button" class="nav-button forge-button" type="button">
        <span id="forge-button-title">Forge</span>
        <span id="forge-button-subtitle" class="nav-button-subtitle"
          >Corrupt ring</span
        >
      </button>
      <section id="forge-status" class="nav-button forge-status-button" hidden>
        <p id="forge-status-text">Forging...</p>
        <div class="forge-progress">
          <div id="forge-progress-fill" class="forge-progress-fill"></div>
        </div>
      </section>
    </nav>

    <script src="scripts/image.js"></script>
  </body>
</html>
