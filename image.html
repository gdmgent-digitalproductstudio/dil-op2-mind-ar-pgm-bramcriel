<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The One Ring – Image Tracking</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body class="ar-page">
    <header class="logo-container">
      <h1 class="logo-text">The One Ring</h1>
      <p class="subtitle">Corrupt The Ring</p>
    </header>

    <div class="ar-wrapper">
      <a-scene
        mindar-image="imageTargetSrc: assets/targets.mind; maxTrack: 1;"
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false"
      >
        <a-assets>
          <a-asset-item
            id="ringModel"
            src="assets/models/ring_base.glb"
          ></a-asset-item>

          <a-asset-item
            id="ringGreenModel"
            src="assets/models/ring_green.glb"
          ></a-asset-item>

          <a-asset-item
            id="ringRedModel"
            src="assets/models/ring_red.glb"
          ></a-asset-item>

          <a-asset-item
            id="ringBlueModel"
            src="assets/models/ring_blue.glb"
          ></a-asset-item>
        </a-assets>

        <a-light type="ambient" intensity="200"></a-light>
        <a-light type="directional" position="1 2 1" intensity="50"></a-light>
        <a-light type="directional" position="-1 1 1" intensity="50"></a-light>
        <a-light type="directional" position="-4 -2 1" intensity="50"></a-light>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
          <a-entity
            gltf-model="#ringModel"
            position="0 -0.5 -3"
            rotation="0 0 0"
            scale="0.25 0.25 0.25"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
          ></a-entity>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 1">
          <a-entity
            gltf-model="#ringGreenModel"
            position="0 0 -3"
            rotation="0 0 0"
            scale="0.25 0.25 0.25"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
          ></a-entity>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 2">
          <a-entity
            gltf-model="#ringRedModel"
            position="0 0 -3"
            rotation="0 0 0"
            scale="0.25 0.25 0.25"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
          ></a-entity>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 3">
          <a-entity
            gltf-model="#ringBlueModel"
            position="0 0 -3"
            rotation="0 0 0"
            scale="0.25 0.25 0.25"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
          ></a-entity>
        </a-entity>
      </a-scene>
    </div>

    <nav class="nav-container">
      <a href="index.html" class="nav-button">
        ← Back
        <span>Return to The Shire</span>
      </a>
    </nav>

    <script src="scripts/image.js"></script>
  </body>
</html>
