<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The One Ring – Face Tracking</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body class="ar-page">
    <header class="logo-container">
      <div class="logo-stack">
        <div class="logo-title-row">
          <h1 class="logo-text">
            <a href="index.html" class="logo-link">The One Ring</a>
          </h1>
        </div>
        <p class="subtitle">Face the Ring</p>
      </div>
    </header>

    <div class="ar-wrapper">
      <header class="ar-floating-header">
        <a href="index.html" class="nav-button ar-floating-button"
          >← Back to The Shire</a
        >
        <button
          id="resist-button"
          class="nav-button ar-floating-button"
          type="button"
        >
          Resist the Ring
        </button>
      </header>

      <a-scene
        mindar-face
        embedded
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false"
      >
        <a-assets>
          <a-asset-item
            id="ringEmpty"
            src="assets/models/ring_empty.glb"
          ></a-asset-item>
          <a-asset-item
            id="ringBaseModel"
            src="assets/models/ring_base.glb"
          ></a-asset-item>
          <a-asset-item
            id="ringRedModel"
            src="assets/models/ring_red.glb"
          ></a-asset-item>
        </a-assets>

        <a-light type="ambient" intensity="100"></a-light>
        <a-light type="directional" position="1 2 1" intensity="50"></a-light>
        <a-light type="directional" position="-1 1 1" intensity="50"></a-light>
        <a-light type="directional" position="-4 -2 1" intensity="50"></a-light>
        <a-camera
          active="false"
          position="0 0 0"
          look-controls="enabled: false"
          wasd-controls="enabled: false"
        ></a-camera>

        <a-entity mindar-face-target="anchorIndex: 10" id="face-target">
          <a-entity
            id="ring-empty"
            gltf-model="#ringEmpty"
            position="0 0.15 -0.08"
            rotation="0 0 0"
            scale="0.15 0.15 0.15"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"
          ></a-entity>
          <a-entity
            id="ring-base"
            gltf-model="#ringBaseModel"
            visible="false"
            position="0 0.15 -0.08"
            rotation="0 0 0"
            scale="0.15 0.15 0.15"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"
          ></a-entity>
          <a-entity
            id="ring-red"
            gltf-model="#ringRedModel"
            visible="false"
            position="0 0.38 -0.08"
            rotation="0 0 0"
            scale="0.15 0.15 0.15"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"
          ></a-entity>
        </a-entity>

        <a-entity mindar-face-target="anchorIndex: 160" id="eye-aura-left">
          <a-sphere
            class="eye-glow-layer"
            data-max-opacity="0.18"
            radius="0.052"
            position="0 0 -0.006"
            material="shader: flat; color: #ff1a1a; transparent: true; opacity: 0.18; blending: additive; depthWrite: false"
          ></a-sphere>
          <a-sphere
            class="eye-glow-layer"
            data-max-opacity="0.38"
            radius="0.036"
            position="0 0 -0.004"
            material="shader: flat; color: #ff0000; transparent: true; opacity: 0.38; blending: additive; depthWrite: false"
            animation="property: scale; dir: alternate; dur: 900; loop: true; to: 1.12 1.12 1.12"
          ></a-sphere>
          <a-sphere
            class="eye-glow-layer"
            data-max-opacity="0.72"
            radius="0.022"
            position="0 0 -0.003"
            material="shader: flat; color: #ff2f2f; transparent: true; opacity: 0.72; blending: additive; depthWrite: false"
          ></a-sphere>
          <a-sphere
            class="eye-glow-layer eye-glow-core"
            data-max-opacity="1"
            radius="0.011"
            position="0 0 -0.0015"
            material="shader: flat; color: #ff8080; transparent: true; opacity: 1; blending: additive; depthWrite: false"
          ></a-sphere>
          <a-box
            class="eye-laser"
            visible="false"
            width="0.04"
            height="0.04"
            depth="1.6"
            position="0 0 0.8"
            material="shader: flat; color: #ff2a2a; transparent: true; opacity: 0.55; blending: additive; depthWrite: false"
            animation__laserFlicker="property: material.opacity; dir: alternate; dur: 120; loop: true; to: 0.2"
          ></a-box>
          <a-box
            class="eye-laser"
            visible="false"
            width="0.015"
            height="0.015"
            depth="1.6"
            position="0 0 0.8"
            material="shader: flat; color: #ffd1d1; transparent: true; opacity: 1; blending: additive; depthWrite: false"
            animation__laserFlickerCore="property: material.opacity; dir: alternate; dur: 90; loop: true; to: 0.7"
          ></a-box>
        </a-entity>

        <a-entity mindar-face-target="anchorIndex: 387" id="eye-aura-right">
          <a-sphere
            class="eye-glow-layer"
            data-max-opacity="0.18"
            radius="0.052"
            position="0 0 -0.006"
            material="shader: flat; color: #ff1a1a; transparent: true; opacity: 0.18; blending: additive; depthWrite: false"
          ></a-sphere>
          <a-sphere
            class="eye-glow-layer"
            data-max-opacity="0.38"
            radius="0.036"
            position="0 0 -0.004"
            material="shader: flat; color: #ff0000; transparent: true; opacity: 0.38; blending: additive; depthWrite: false"
            animation="property: scale; dir: alternate; dur: 900; loop: true; to: 1.12 1.12 1.12"
          ></a-sphere>
          <a-sphere
            class="eye-glow-layer"
            data-max-opacity="0.72"
            radius="0.022"
            position="0 0 -0.003"
            material="shader: flat; color: #ff2f2f; transparent: true; opacity: 0.72; blending: additive; depthWrite: false"
          ></a-sphere>
          <a-sphere
            class="eye-glow-layer eye-glow-core"
            data-max-opacity="1"
            radius="0.011"
            position="0 0 -0.0015"
            material="shader: flat; color: #ff8080; transparent: true; opacity: 1; blending: additive; depthWrite: false"
          ></a-sphere>
          <a-box
            class="eye-laser"
            visible="false"
            width="0.04"
            height="0.04"
            depth="1.6"
            position="0 0 0.8"
            material="shader: flat; color: #ff2a2a; transparent: true; opacity: 0.55; blending: additive; depthWrite: false"
            animation__laserFlicker="property: material.opacity; dir: alternate; dur: 120; loop: true; to: 0.2"
          ></a-box>
          <a-box
            class="eye-laser"
            visible="false"
            width="0.015"
            height="0.015"
            depth="1.6"
            position="0 0 0.8"
            material="shader: flat; color: #ffd1d1; transparent: true; opacity: 1; blending: additive; depthWrite: false"
            animation__laserFlickerCore="property: material.opacity; dir: alternate; dur: 90; loop: true; to: 0.7"
          ></a-box>
        </a-entity>
      </a-scene>
    </div>

    <nav class="nav-container nav-container-single">
      <section id="movement-meter" class="nav-button forge-status-button">
        <p id="movement-meter-text">Corruption meter: 0%</p>
        <div class="forge-progress">
          <div id="movement-meter-fill" class="forge-progress-fill"></div>
        </div>
      </section>
    </nav>

    <script src="scripts/face.js"></script>
  </body>
</html>
